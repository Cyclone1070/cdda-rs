[workspace]
resolver = "3"
members = ["crates/cli", "crates/content", "crates/core-types", "crates/json", "crates/oracle", "crates/sim"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# **Line tables, not full debug info.** The default dev profile carries `debug = 2` - full type and variable
# information - through every crate including the dependencies, and every link then has to place it. This project's
# tests fail with a message and a line, not with a debugger session, so what is kept is what a panic needs: file, line
# and column. Measured on the build machine: the test binary is a fraction of the size and links faster.
[profile.dev]
debug = "line-tables-only"

# Dependencies are not stepped through either, and they are the larger half of the target directory.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
