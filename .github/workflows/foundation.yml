name: foundation

# What runs today, on every push and pull request. The jobs need no oracle build
# and no C++ compiler: they need the Rust toolchain, and the reference's **data**
# tree, which is gitignored and is fetched at the pinned commit and cached. They
# exist so that a regression in the foundation cannot be merged unnoticed, and so
# that the larger validation in port-validation.yml has something green to build on.
#
# Everything here is a command that was run by hand first.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    # One test - every_scenario_in_the_repository_passes - costs 1,070 s on the build machine, and a
    # cold build on a two-core runner is slower than that machine. The suite is due to get faster; until
    # it does, the limit has to be honest rather than tight.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the workspace's `rust-version`. An unpinned `@stable` moved the lint set under our
      # feet once already (`redundant_else` fired on CI and not on the build machine), and a gate that
      # disagrees with itself is noise.
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # **The reference's own data, at the pinned commit.** 149 tests read it - the item tree, the
      # ammunition effects, the armour - and it is gitignored, so without this step those tests skip
      # and the runner proves nothing about the data-shaped rules. Shallow, one commit, and cached keyed
      # by the pin: a fetch costs a minute once and nothing after that.
      - uses: actions/cache@v4
        with:
          path: references/Cataclysm-DDA
          key: cdda-reference-${{ hashFiles('docs/11-oracle-harness.md') }}
      - name: the reference's data
        run: |
          set -euo pipefail
          PIN=7b2efa5cea38e4d4d97dd0e63b28b9148623da59
          if [ ! -d references/Cataclysm-DDA/data/json ]; then
            git init -q references/Cataclysm-DDA
            git -C references/Cataclysm-DDA remote add origin https://github.com/CleverRaven/Cataclysm-DDA
            git -C references/Cataclysm-DDA fetch -q --depth 1 origin "$PIN"
            git -C references/Cataclysm-DDA checkout -q FETCH_HEAD
          fi
          # The binary looks for the game's data beside the oracle's sources, which is where the build
          # machine keeps its copy. A link, not a second copy: two trees are two answers.
          mkdir -p oracle/src
          ln -sfn ../../references/Cataclysm-DDA/data oracle/src/data
          test -d oracle/src/data/json
      - name: formatting
        run: cargo fmt --all -- --check
      - name: lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: references/Cataclysm-DDA
          key: cdda-reference-${{ hashFiles('docs/11-oracle-harness.md') }}
      - name: the reference's data
        run: |
          set -euo pipefail
          PIN=7b2efa5cea38e4d4d97dd0e63b28b9148623da59
          if [ ! -d references/Cataclysm-DDA/data/json ]; then
            git init -q references/Cataclysm-DDA
            git -C references/Cataclysm-DDA remote add origin https://github.com/CleverRaven/Cataclysm-DDA
            git -C references/Cataclysm-DDA fetch -q --depth 1 origin "$PIN"
            git -C references/Cataclysm-DDA checkout -q FETCH_HEAD
          fi
          mkdir -p oracle/src
          ln -sfn ../../references/Cataclysm-DDA/data oracle/src/data
      - name: documents agree with each other and with the sources
        run: python3 tools/check_docs.py
      # The inventory is generated from the pinned reference checkout, which is fetched and never
      # committed, so this step cannot run on a runner without it. It says so rather than passing
      # silently, and the local gate still regenerates and compares.
      - name: the generated inventory is up to date
        run: |
          if [ -d references/Cataclysm-DDA ]; then
            python3 tools/gen_inventory.py --out docs/06-inventory.md
            git diff --exit-code docs/06-inventory.md
          else
            echo "references/Cataclysm-DDA is not in this checkout: inventory regeneration skipped"
          fi
