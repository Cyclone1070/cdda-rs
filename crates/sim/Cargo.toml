[package]
name = "cdda-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy_ecs = { version = "0.20.0", default-features = false }
cdda-core-types = { path = "../core-types" }
cdda-content = { path = "../content" }
# The data's own math functions are read from parsed JSON, so the sim needs the value type it parses into - the same one `cdda_content::read_json` answers.
cdda-json = { path = "../json" }

[dev-dependencies]
cdda-oracle = { path = "../oracle" }

[lints]
workspace = true
