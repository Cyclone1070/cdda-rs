[package]
name = "cdda-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cdda_cli"
path = "src/lib.rs"

[[bin]]
name = "cdda-cli"
path = "src/main.rs"

[dependencies]
bevy_ecs = { version = "0.20.0", default-features = false }
cdda-core-types = { path = "../core-types" }
cdda-content = { path = "../content" }
cdda-json = { path = "../json" }
cdda-oracle = { path = "../oracle" }
cdda-sim = { path = "../sim" }

[lints]
workspace = true
